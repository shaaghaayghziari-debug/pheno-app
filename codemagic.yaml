workflows:
  pheno-ios:
    name: PHENO iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pheno.app
    scripts:
      - name: Generate iOS and Android platform folders
        script: |
          set -e
          flutter create . \
            --platforms=ios,android \
            --project-name pheno \
            --org com.pheno \
            --ios-language swift \
            --android-language kotlin

          # Keep PHENO's fixed iOS bundle identifier for Codemagic signing.
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/com\.pheno\.pheno/com.pheno.app/g' ios/Runner.xcodeproj/project.pbxproj
          fi

      - name: Get packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Build iOS IPA
        script: |
          set -e
          xcode-project use-profiles
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  pheno-android:
    name: PHENO Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform folder
        script: |
          set -e
          flutter create . \
            --platforms=android \
            --project-name pheno \
            --org com.pheno \
            --android-language kotlin

          # Keep the Android application id aligned with PHENO.
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "com\.pheno\.pheno"/applicationId "com.pheno.app"/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com\.pheno\.pheno"/applicationId = "com.pheno.app"/g' android/app/build.gradle.kts
          fi

      - name: Get packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
